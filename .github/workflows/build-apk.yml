name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK (preinstalled on runner)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM=$(ls $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | $SDKM --licenses > /dev/null || true
          $SDKM "platforms;android-35" "build-tools;35.0.0" "platform-tools" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --console=plain 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        run: |
          if [ -f build.log ]; then
            MSG=$(grep -E "^e: |error:|What went wrong|Could not|> " build.log | head -60 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Build errors::$MSG"
          else
            echo "::error title=Build errors::build.log missing - failure happened before Gradle"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: PhoneGuardPro-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish APK as direct download (latest release)
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk PhoneGuardPro.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest PhoneGuardPro.apk --title "Phone Guard Pro (latest build)" --notes "Debug build from commit ${GITHUB_SHA::7}. Install on Android 10+."
